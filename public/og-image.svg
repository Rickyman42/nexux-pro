<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0D12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111318;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3BB8B0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Glow orb top-right -->
  <ellipse cx="1050" cy="120" rx="280" ry="200" fill="#4ECDC4" opacity="0.06" />

  <!-- Grid lines subtle -->
  <line x1="0" y1="210" x2="1200" y2="210" stroke="#4ECDC4" stroke-width="0.5" opacity="0.08" />
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#4ECDC4" stroke-width="0.5" opacity="0.08" />
  <line x1="400" y1="0" x2="400" y2="630" stroke="#4ECDC4" stroke-width="0.5" opacity="0.08" />
  <line x1="800" y1="0" x2="800" y2="630" stroke="#4ECDC4" stroke-width="0.5" opacity="0.08" />

  <!-- Top teal bar -->
  <rect x="80" y="80" width="60" height="4" fill="url(#accent)" rx="2" />

  <!-- Eyebrow -->
  <text x="80" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" letter-spacing="3" fill="#4ECDC4" text-transform="uppercase">NEXUX PRO</text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" font-style="italic" fill="#F0F2F5">Tu peluquería</text>
  <text x="80" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" font-style="italic" fill="#F0F2F5">en piloto</text>
  <text x="80" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" font-style="italic" fill="url(#accent)">automático.</text>

  <!-- Subline -->
  <text x="80" y="490" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#8892A0">Lara responde WhatsApp 24h · Agenda citas · Reduce no-shows</text>

  <!-- Stats right side -->
  <rect x="800" y="180" width="320" height="140" rx="16" fill="#161A22" stroke="#222832" stroke-width="1" />
  <text x="960" y="230" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#4ECDC4">&lt; 4s</text>
  <text x="960" y="262" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#8892A0">Tiempo de respuesta</text>
  <line x1="960" y1="278" x2="960" y2="300" stroke="#222832" stroke-width="1" />
  <text x="960" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4ECDC4">87% sin intervención humana</text>

  <rect x="800" y="340" width="320" height="140" rx="16" fill="#161A22" stroke="#222832" stroke-width="1" />
  <text x="960" y="390" text-anchor="middle" font-family="Georgia, serif" font-size="42" font-weight="700" fill="#4ECDC4">–60%</text>
  <text x="960" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#8892A0">Reducción de no-shows</text>
  <line x1="960" y1="438" x2="960" y2="458" stroke="#222832" stroke-width="1" />
  <text x="960" y="455" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#4ECDC4">Desde 249€/mes · 30 días garantía</text>

  <!-- Bottom domain -->
  <text x="80" y="580" font-family="system-ui, sans-serif" font-size="20" fill="#4A5568">nexux.pro</text>
</svg>
